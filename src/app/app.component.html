<ion-app>
  <ion-menu contentId="main-content" type="overlay">
    <ion-header>
      <ion-toolbar>
        <ion-title>Video Engine</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <ion-item routerLink="/dashboard" routerDirection="root">
          <ion-icon name="home-outline" slot="start"></ion-icon>
          <ion-label>Dashboard</ion-label>
        </ion-item>
        <ion-item routerLink="/import" routerDirection="root">
          <ion-icon name="document-outline" slot="start"></ion-icon>
          <ion-label>Import Spreadsheet</ion-label>
        </ion-item>
        <ion-item routerLink="/generate" routerDirection="root">
          <ion-icon name="videocam-outline" slot="start"></ion-icon>
          <ion-label>Generate Videos</ion-label>
        </ion-item>
        <ion-item routerLink="/storage" routerDirection="root">
          <ion-icon name="cloud-outline" slot="start"></ion-icon>
          <ion-label>Cloud Storage</ion-label>
        </ion-item>
        <ion-item-divider>
          <ion-label>TikTok</ion-label>
        </ion-item-divider>
        <ion-item routerLink="/tiktok/auth" routerDirection="root">
          <ion-icon name="logo-tiktok" slot="start"></ion-icon>
          <ion-label>Connect Account</ion-label>
        </ion-item>
        <ion-item routerLink="/tiktok/post" routerDirection="root">
          <ion-icon name="cloud-upload-outline" slot="start"></ion-icon>
          <ion-label>Post to TikTok</ion-label>
        </ion-item>
        <ion-item routerLink="/tiktok/status" routerDirection="root">
          <ion-icon name="list-outline" slot="start"></ion-icon>
          <ion-label>Post Status</ion-label>
        </ion-item>
        <ion-item routerLink="/tiktok/analytics" routerDirection="root">
          <ion-icon name="bar-chart-outline" slot="start"></ion-icon>
          <ion-label>Analytics</ion-label>
        </ion-item>
        <ion-item-divider>
          <ion-label>Settings</ion-label>
        </ion-item-divider>
        <ion-item routerLink="/api-config" routerDirection="root">
          <ion-icon name="key-outline" slot="start"></ion-icon>
          <ion-label>API Configuration</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>
  
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
